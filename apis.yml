aid: hex-security
name: Hex Security
description: >-
  Hex Security is a Y Combinator (W26) security startup building autonomous AI
  agents that perform continuous penetration testing against web applications,
  APIs, and infrastructure. Instead of point-in-time annual pentests, Hex's
  agents probe systems around the clock — chaining exploits together, validating
  each finding with a working proof-of-concept, and delivering triaged,
  reproducible results with no false positives. The product surfaces
  high-severity issues such as SQL injection, broken access control / IDOR,
  authentication bypass, and unauthenticated remote code execution. Founded by
  Ahmad Khan, Huzaifa Ahmad, and Prama Yudhistira. As of this profile Hex
  Security is pre-public-API: it operates a marketing site (hex.co) and a
  product application (app.hex.co) but does not yet publish a developer portal,
  OpenAPI definition, or public API surface.
